<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — Fairline</title>
<meta name="description" content="Fairline — спорядження для туризму, спорту, саду й дому. Доставка по Україні.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 20'%3E%3Crect width='14' height='20' fill='%23fff'/%3E%3Crect y='6.6' width='14' height='6.8' fill='%23c8322b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="catalog">
<div id="site-header"></div>
<main id="main">
<div class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Навігація"></nav>
  <div id="cat-head"></div>
  <div class="subcats" id="subcats"></div>
  <div class="catalog">
    <aside class="filters" id="filters" aria-label="Фільтри"></aside>
    <section>
      <div class="toolbar">
        <span id="found" aria-live="polite"></span>
        <span style="display:flex;gap:8px">
          <button class="btn btn--ghost filters-open" id="fopen">Фільтри</button>
          <label class="vh" for="sort">Сортування</label>
          <select id="sort"><option value="pop">Спочатку популярні</option><option value="cheap">Спочатку дешевші</option><option value="dear">Спочатку дорожчі</option><option value="new">Новинки</option></select>
        </span>
      </div>
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </section>
  </div>
</div>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/art.js"></script>
<script src="assets/app.js"></script>
<script src="assets/motion.js"></script>

</body>
</html>
